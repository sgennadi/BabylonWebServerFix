name: Sync stable release notes

on:
  push:
    branches: [main]
    paths:
      - 'releases/v*.md'

permissions:
  contents: write

jobs:
  sync-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update published release descriptions for changed stable notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- releases/ | while IFS= read -r path; do
            if [[ "$path" =~ ^releases/(v[0-9]+\.[0-9]+\.[0-9]+)\.md$ ]]; then
              tag="${BASH_REMATCH[1]}"
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$path"
                echo "Updated published notes for $tag"
              fi
            fi
          done
