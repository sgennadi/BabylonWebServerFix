name: Stable release

on:
  push:
    branches: [main]
    paths:
      - 'src/BabylonWebServerFix/BabylonWebServerFix.csproj'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag (e.g. v1.0.6)'
        required: true
        default: 'v1.0.6'
        type: string

permissions:
  contents: write

jobs:
  stable-release:
    runs-on: windows-2025
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Resolve version and validate optional release tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $version = (dotnet msbuild src/BabylonWebServerFix/BabylonWebServerFix.csproj -getProperty:Version -nologo).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "^\d+\.\d+\.\d+$") { throw "Invalid project version: $version" }
          $tag = "v$version"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:INPUT_TAG -ne $tag) { throw "Requested tag $env:INPUT_TAG does not match project $tag" }
          "TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "Release tag: $tag"
      - name: Verify release notes for the version
        run: |
          if not exist "releases/%TAG%.md" exit /b 1
      - name: Build, smoke test, and publish x64
        run: |
          dotnet build src/BabylonWebServerFix/BabylonWebServerFix.csproj -c Release
          if errorlevel 1 exit /b 1
          dotnet run --project tests/BabylonWebServerFix.SmokeTests/BabylonWebServerFix.SmokeTests.csproj -c Release
          if errorlevel 1 exit /b 1
          dotnet publish src/BabylonWebServerFix/BabylonWebServerFix.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=none -p:DebugSymbols=false -o dist
          if errorlevel 1 exit /b 1
      - name: Verify help and examples in executable
        run: |
          dist\BabylonWebServerFix.exe > help.txt
          if errorlevel 1 exit /b 1
          findstr /C:"Examples:" help.txt >NUL
          if errorlevel 1 exit /b 1
          dist\BabylonWebServerFix.exe /? > help.txt
          if errorlevel 1 exit /b 1
          findstr /C:"Examples:" help.txt >NUL
          if errorlevel 1 exit /b 1
          dist\BabylonWebServerFix.exe --help > help.txt
          if errorlevel 1 exit /b 1
          findstr /C:"Examples:" help.txt >NUL
          if errorlevel 1 exit /b 1
          dist\BabylonWebServerFix.exe -h > help.txt
          if errorlevel 1 exit /b 1
          findstr /C:"Examples:" help.txt >NUL
          if errorlevel 1 exit /b 1
          findstr /C:"tray-init" help.txt >NUL
          if errorlevel 1 exit /b 1
          del help.txt
      - name: Generate SHA-256 checksum
        run: |
          for /f "tokens=1" %%H in ('certutil -hashfile "dist\BabylonWebServerFix.exe" SHA256 ^| findstr /R /I "^[0-9a-f][0-9a-f]*$"') do @echo %%H *BabylonWebServerFix.exe>dist\SHA256SUMS.txt
          if not exist dist\SHA256SUMS.txt exit /b 1
          for %%F in (dist\BabylonWebServerFix.exe) do @if %%~zF LSS 1000000 exit /b 1
      - name: Create or update stable release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          gh release view "%TAG%" --repo "%GITHUB_REPOSITORY%" >NUL 2>&1
          if errorlevel 1 (
            gh release create "%TAG%" "dist/BabylonWebServerFix.exe" "dist/SHA256SUMS.txt" --target "%GITHUB_SHA%" --repo "%GITHUB_REPOSITORY%" --title "%TAG% Stable" --notes-file "releases/%TAG%.md" --latest
          ) else (
            gh release upload "%TAG%" "dist/BabylonWebServerFix.exe" "dist/SHA256SUMS.txt" --clobber --repo "%GITHUB_REPOSITORY%"
          )
          if errorlevel 1 exit /b 1
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          gh release view "%TAG%" --repo "%GITHUB_REPOSITORY%" --json assets --jq ".assets[].name" > assets.txt
          if errorlevel 1 exit /b 1
          findstr /X /C:"BabylonWebServerFix.exe" assets.txt >NUL
          if errorlevel 1 exit /b 1
          findstr /X /C:"SHA256SUMS.txt" assets.txt >NUL
          if errorlevel 1 exit /b 1
          del assets.txt
