name: Stable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag (e.g. v1.0.5)'
        required: true
        default: 'v1.0.5'
        type: string

permissions:
  contents: write

jobs:
  stable-release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate release tag matches project version
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $version = ([xml](Get-Content 'src/BabylonWebServerFix/BabylonWebServerFix.csproj')).Project.PropertyGroup.Version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match project v$version" }
      - name: Build, smoke test, and publish x64
        shell: cmd
        run: |
          dotnet build src/BabylonWebServerFix/BabylonWebServerFix.csproj -c Release
          if errorlevel 1 exit /b 1
          dotnet run --project tests/BabylonWebServerFix.SmokeTests/BabylonWebServerFix.SmokeTests.csproj -c Release
          if errorlevel 1 exit /b 1
          dotnet publish src/BabylonWebServerFix/BabylonWebServerFix.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=none -p:DebugSymbols=false -o dist
          if errorlevel 1 exit /b 1
          dist\BabylonWebServerFix.exe --help >NUL
          if errorlevel 1 exit /b 1
      - name: Verify no-argument and slash-help behavior
        shell: pwsh
        run: |
          foreach ($argSet in @(@(), @('/?'), @('--help'), @('-h'))) {
            $result = if ($argSet.Count -eq 0) { & 'dist/BabylonWebServerFix.exe' } else { & 'dist/BabylonWebServerFix.exe' @argSet }
            if ($LASTEXITCODE -ne 0 -or -not (($result -join "`n") -match 'Examples:')) {
              throw "Help verification failed for: $($argSet -join ' ')"
            }
          }
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/BabylonWebServerFix.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'dist/SHA256SUMS.txt' -Value "$hash *BabylonWebServerFix.exe" -Encoding ascii
          if ((Get-Item 'dist/BabylonWebServerFix.exe').Length -lt 1000000) { throw 'Unexpectedly small EXE' }
      - name: Create or update stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG 'dist/BabylonWebServerFix.exe' 'dist/SHA256SUMS.txt' --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG 'dist/BabylonWebServerFix.exe' 'dist/SHA256SUMS.txt' --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --title "$env:TAG Stable" --notes-file 'releases/v1.0.5.md' --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publish failed. Check RELEASE_TOKEN / Actions permissions.' }
      - name: Verify assets before pruning old releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $assets = @(gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify published release' }
          foreach ($required in @('BabylonWebServerFix.exe', 'SHA256SUMS.txt')) {
            if ($assets -notcontains $required) { throw "Missing release asset: $required" }
          }
          Write-Host "Verified release $env:TAG with EXE and checksum."
      - name: Remove superseded stable and preview releases
        if: ${{ inputs.tag == 'v1.0.5' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          foreach ($old in @('v1.0.4')) {
            gh release view $old --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release delete $old --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete $old" }
              Write-Host "Removed superseded release $old"
            }
          }
