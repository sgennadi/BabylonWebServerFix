name: Windows build and smoke tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build CLI
        run: dotnet build src/BabylonWebServerFix/BabylonWebServerFix.csproj --configuration Release
      - name: Offline smoke tests (no IIS/Apache changes)
        run: dotnet run --project tests/BabylonWebServerFix.SmokeTests/BabylonWebServerFix.SmokeTests.csproj --configuration Release
      - name: Publish single-file Windows x64
        run: >-
          dotnet publish src/BabylonWebServerFix/BabylonWebServerFix.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false -p:DebugType=none -p:DebugSymbols=false
          --output dist/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: BabylonWebServerFix-win-x64
          path: dist/win-x64/BabylonWebServerFix.exe
          if-no-files-found: error
